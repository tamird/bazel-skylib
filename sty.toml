[analysis]
strict-generic-narrowing = true
require-valid-suppressions = true

[type-interfaces]
"bzl_library.bzl" = "bzl_library.bzli"
"rules/private/bzl_library.bzl" = "rules/private/bzl_library.bzli"
"rules/private/copy_common.bzl" = "rules/private/copy_common.bzli"
"rules/private/copy_directory_private.bzl" = "rules/private/copy_directory_private.bzli"
"rules/private/copy_file_private.bzl" = "rules/private/copy_file_private.bzli"
"rules/private/write_file_private.bzl" = "rules/private/write_file_private.bzli"
"lib/collections.bzl" = "lib/collections.bzli"
"lib/modules.bzl" = "lib/modules.bzli"
"lib/paths.bzl" = "lib/paths.bzli"
"lib/shell.bzl" = "lib/shell.bzli"
"lib/structs.bzl" = "lib/structs.bzli"
"lib/subpackages.bzl" = "lib/subpackages.bzli"
"lib/types.bzl" = "lib/types.bzli"
"lib/versions.bzl" = "lib/versions.bzli"
"rules/analysis_test.bzl" = "rules/analysis_test.bzli"
"rules/common_settings.bzl" = "rules/common_settings.bzli"
"rules/diff_test.bzl" = "rules/diff_test.bzli"
"rules/expand_template.bzl" = "rules/expand_template.bzli"
"rules/native_binary.bzl" = "rules/native_binary.bzli"
"rules/select_file.bzl" = "rules/select_file.bzli"
"rules/directory/providers.bzl" = "rules/directory/providers.bzli"
"rules/directory/private/paths.bzl" = "rules/directory/private/paths.bzli"
"rules/directory/private/glob.bzl" = "rules/directory/private/glob.bzli"
"rules/directory/directory.bzl" = "rules/directory/directory.bzli"
"rules/directory/glob.bzl" = "rules/directory/glob.bzli"
"rules/directory/subdirectory.bzl" = "rules/directory/subdirectory.bzli"

[rules]
missing-parameter-annotation = "error"
missing-return-annotation = "error"
missing-type-argument = "error"
unsound-assignment = "error"
unsound-return-statement = "error"
explicit-any = "error"
non-static-type = "error"
blanket-ignore-comment = "error"
possibly-unresolved-reference = "error"
possibly-missing-attribute = "error"
division-by-zero = "error"
