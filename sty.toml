[analysis]
strict-generic-narrowing = true

[type-interfaces]
"lib/paths.bzl" = "lib/paths.bzli"
"lib/shell.bzl" = "lib/shell.bzli"
"rules/common_settings.bzl" = "rules/common_settings.bzli"
"rules/directory/providers.bzl" = "rules/directory/providers.bzli"
"rules/directory/private/paths.bzl" = "rules/directory/private/paths.bzli"
"rules/directory/private/glob.bzl" = "rules/directory/private/glob.bzli"
"rules/directory/directory.bzl" = "rules/directory/directory.bzli"
"rules/directory/glob.bzl" = "rules/directory/glob.bzli"
"rules/directory/subdirectory.bzl" = "rules/directory/subdirectory.bzli"

[rules]
missing-parameter-annotation = "error"
missing-return-annotation = "error"
missing-type-argument = "error"
unsound-assignment = "error"
unsound-return-statement = "error"
explicit-any = "error"
non-static-type = "error"
blanket-ignore-comment = "error"
possibly-unresolved-reference = "error"
division-by-zero = "error"
