name: Starlark types

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sty:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: tamird/sty@3f9130a6cffc1d2a193351debe9f4849bd73f4d6
        with:
          audit-loads: true
          bazel-version: '8.8.1'
          files: |
            distribution/distribution.bzl
            rules/copy_directory.bzl
            rules/copy_file.bzl
            rules/write_file.bzl
            version.bzl
