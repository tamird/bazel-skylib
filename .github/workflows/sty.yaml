name: Starlark types

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sty:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: tamird/sty@d60befb4f9d99eb51f737e54047dd71601ba7f7d
        continue-on-error: true
        with:
          bazel-version: '8.8.1'
          files: |
            lib/paths.bzl
            rules/directory/providers.bzl
            rules/directory/private/paths.bzl
            rules/directory/private/glob.bzl
